# Development profile (run with: ./run-local.sh dev).
# Serve the website straight from ../frontend so edits show on a browser refresh (no rebuild), and never cache it.
spring.web.resources.static-locations=file:../frontend/
spring.web.resources.cache.period=0

# TESTING-CONVENIENCE (D23): every browser tab can be logged in as a different account. Remove this line (or set PER_TAB_SESSIONS=false)
# to go back to one login per browser.
app.auth.per-tab-sessions=${PER_TAB_SESSIONS:true}
