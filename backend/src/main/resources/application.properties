spring.application.name=fix-it-backend

# PostgreSQL (override via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fix_it}
spring.datasource.username=${DB_USERNAME:vivekspc}
spring.datasource.password=${DB_PASSWORD:}

# Schema is created by SQL (Phase 3); Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Google Sign-In (Phase 5) ----
# PLACEHOLDERS: replace via environment variables. See PLACEHOLDERS_TO_CHANGE.md at the repo root.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:PLACEHOLDER_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:PLACEHOLDER_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Only accounts whose email ends with @<domain> may log in
app.auth.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:smail.iitm.ac.in}
# Where the browser is sent after login/failed login (the frontend; not built yet)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Session cookie: not readable by JS, not sent on cross-site POSTs (CSRF protection, see SecurityConfig)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- Embeddings ----
# Provider: Jina AI (https://api.jina.ai/v1/embeddings), model jina-embeddings-v4 (native vector size 2048).
# Everything below is overridable by environment variable; only the API KEY is secret and has no real default.
app.embedding.provider=${EMBEDDING_PROVIDER:jina}
app.embedding.model=${EMBEDDING_MODEL:jina-embeddings-v4}
app.embedding.api-url=${EMBEDDING_API_URL:https://api.jina.ai/v1/embeddings}
# SECRET - supply via the EMBEDDING_API_KEY environment variable (see backend/.env.local and run-local.sh). Never commit it.
app.embedding.api-key=${EMBEDDING_API_KEY:PLACEHOLDER_TO_BE_PROVIDED_SECURELY}
# Vector length requested from the model AND the length every stored/returned vector must have.
# Changing it means re-embedding every question (EMBEDDING_REINDEX_ON_STARTUP=true once); old-size vectors are ignored by search.
app.embedding.dimension=${EMBEDDING_DIMENSION:2048}
# PROPOSED default, not yet confirmed: TITLE_AND_BODY | TITLE_ONLY | BODY_ONLY
app.embedding.text-source=${EMBEDDING_TEXT_SOURCE:TITLE_AND_BODY}

# Re-embed all questions that are missing/stale once at startup (needs a configured provider). Off by default.
app.embedding.reindex-on-startup=${EMBEDDING_REINDEX_ON_STARTUP:false}

# ---- Search tuning (Phases 16-18) ----
# PROVISIONAL starting values, chosen from a small live experiment with Jina v4 (6 campus questions, 6 queries; see
# PLACEHOLDERS_TO_CHANGE.md). They are sensible defaults, NOT tuned: override with the environment variables below.
# Hybrid fraction: share of the SEMANTIC score, 0..1. Lexical share = 1 - this  (0.7 = 70% semantic / 30% lexical).
app.search.semantic-weight=${SEARCH_SEMANTIC_WEIGHT:0.7}
# Hybrid search (the default mode): minimum hybrid score (0..1). Measured with Jina v4 on 22 campus questions: clearly relevant
# 0.64-0.67, loosely related 0.39-0.42, unrelated 0.24-0.37 (nonsense queries <= 0.30). 0.38 admits the loosely related ones
# and still excludes the unrelated ones. (It was 0.5, which showed only clearly relevant questions.)
app.search.hybrid-threshold=${SEARCH_HYBRID_THRESHOLD:0.38}
# Standalone semantic mode: minimum cosine similarity. Measured (Jina v4): relevant 0.67-0.80, loosely related 0.55-0.60,
# unrelated 0.34-0.50 - Jina's cosine "floor" is high, so this must stay well above 0.5.
app.search.semantic-threshold=${SEARCH_SEMANTIC_THRESHOLD:0.6}
# Standalone lexical mode: minimum normalised BM25 score (0..1).
app.search.lexical-threshold=${SEARCH_LEXICAL_THRESHOLD:0.3}
# Standard Okapi BM25 constants (algorithm defaults).
app.search.bm25-k1=${SEARCH_BM25_K1:1.2}
app.search.bm25-b=${SEARCH_BM25_B:0.75}
# Engineering limit (not a tuning value): maximum results returned.
app.search.max-results=${SEARCH_MAX_RESULTS:20}

# Load tags for whole lists of questions in batches instead of one query per question (homepage/profile lists)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Never put exception messages or stack traces into error responses (the API's own handler sets safe messages)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ---- Authentication ----
# Username + password login is the active login method for now (/api/auth/register, /api/auth/login).
# Google sign-in is kept in the code but OFF; set GOOGLE_AUTH_ENABLED=true (plus GOOGLE_CLIENT_ID/SECRET) to turn it on.
app.auth.google-enabled=${GOOGLE_AUTH_ENABLED:false}
# Throttling of failed logins: N failures for one account name / one IP address within the window locks it for the window.
app.auth.login-max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.auth.login-max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:20}
app.auth.login-window-minutes=${LOGIN_WINDOW_MINUTES:15}

# ---- Tags ----
# The fixed set of tags a question can have (comma separated). Users choose from these; they cannot create new ones.
app.tags.allowed=${ALLOWED_TAGS:tech,math,code,others}

# ---- Rate limits (protect the paid embedding calls and sign-up) ----
# Per user: every search / every question create-or-edit makes one embedding request.
app.rate-limit.search-per-minute=${RATE_LIMIT_SEARCH_PER_MINUTE:30}
app.rate-limit.question-writes-per-minute=${RATE_LIMIT_QUESTION_WRITES_PER_MINUTE:10}
# Per IP address: sign-ups (so one script cannot mint unlimited accounts, each with its own per-user quota).
app.rate-limit.registrations-per-ip-per-hour=${RATE_LIMIT_REGISTRATIONS_PER_IP_PER_HOUR:10}

# ---- TESTING-CONVENIENCE: per-tab sessions (see NOTES_AND_OPEN_DECISIONS.md D23) ----
# A browser keeps one session cookie per site, so two tabs cannot be two different accounts. When true, login/sign-up also return
# a token that each browser TAB keeps in its own sessionStorage and sends as "Authorization: Bearer ..."; it overrides the cookie.
# OFF by default (and in production). The "dev" profile turns it on. Set PER_TAB_SESSIONS=false to switch it off there too.
app.auth.per-tab-sessions=${PER_TAB_SESSIONS:false}
app.auth.tab-session-idle-hours=${TAB_SESSION_IDLE_HOURS:12}
